[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cto-audit"
version = "0.1.0"
description = "Audit your codebase like a CTO — infrastructure, architecture, security, quality, compliance"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
keywords = [
    "audit", "cto", "code-quality", "security", "architecture",
    "infrastructure", "compliance", "nis2", "gdpr", "tech-debt",
    "due-diligence", "devops", "dora",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-languages>=1.10",
    "tomli>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
llm-claude = ["anthropic>=0.40.0"]
llm-gemini = ["google-genai>=1.0.0"]
llm-local = ["ollama>=0.4.0"]
pdf = ["weasyprint>=62.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
]

# [project.urls]
# TODO: aggiornare quando il progetto sara pubblicato su GitHub
# Homepage = "https://github.com/cto-audit/cto-audit"
# Repository = "https://github.com/cto-audit/cto-audit"
# Issues = "https://github.com/cto-audit/cto-audit/issues"

[project.scripts]
cto-audit = "cto_audit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cto_audit"]

# Include i file YAML dati nel package installato
[tool.hatch.build.targets.wheel.force-include]
"scoring-profiles" = "cto_audit/data/scoring-profiles"
"remediation-kb" = "cto_audit/data/remediation-kb"
"compliance-profiles" = "cto_audit/data/compliance-profiles"

# Include anche nel sdist
[tool.hatch.build.targets.sdist]
include = [
    "src/cto_audit/",
    "scoring-profiles/",
    "remediation-kb/",
    "compliance-profiles/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
